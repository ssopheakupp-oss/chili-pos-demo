name: Deploy POS demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
        working-directory: client
      - name: Build website
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.POS_API_URL }}
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
